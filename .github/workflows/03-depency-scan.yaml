# ---------------------------------------------------------
# Workflow: 03-Dependency-Scan.yml
# Objetivo: Analisar vulnerabilidades conhecidas em dependências
# Ferramentas: Trivy (Node, Java, Python)
# ---------------------------------------------------------

name: 03-Dependency-Scan

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel previous runs if um novo commit for enviado
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: [arc-runner-set]
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      # 1️. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️. Detecta o gerenciador de pacotes (Node, Maven, Python)
      - name: Detect package manager
        id: detect
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            echo "PACKAGE_MANAGER=node" >> $GITHUB_ENV
          elif [ -f pom.xml ]; then
            echo "PACKAGE_MANAGER=maven" >> $GITHUB_ENV
          elif [ -f requirements.txt ]; then
            echo "PACKAGE_MANAGER=python" >> $GITHUB_ENV
          else
            echo "PACKAGE_MANAGER=unknown" >> $GITHUB_ENV
          fi
          echo "Detected package manager: $PACKAGE_MANAGER"

      # 3️. Executa Trivy Vulnerability Scan (dependências)
      - name: Run Trivy Dependency Scan
        id: trivy-deps
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs # file system scan
          scanners: vuln # vulnerabilidades
          severity: HIGH,CRITICAL
          format: json
          output: trivy-deps.json

      # 4️. Gera resumo legível no Actions Summary
      - name: Generate Dependency Scan Summary
        if: always()
        run: |
          REPORT="trivy-deps.json"
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY

          if [ -f $REPORT ] && [ -s $REPORT ]; then
            COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' $REPORT)
            echo "Encontradas $COUNT vulnerabilidades críticas ou altas." >> $GITHUB_STEP_SUMMARY

            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat $REPORT | jq '.' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ "$COUNT" -gt 0 ]; then
              echo "Falha: Vulnerabilidades críticas/altas detectadas!"
              exit 1
            fi
          else
            echo "Nenhuma vulnerabilidade crítica/alta encontrada nas dependências."
          fi
