# ---------------------------------------------------------
# Workflow: 02-SonarQube.yml
# Objetivo: Executar análise estática de código (SAST)
# Ferramenta: SonarQube rodando localmente (em serviço)
# ---------------------------------------------------------

name: 02-SonarQube

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar-sast:
    name: SAST Analysis (SonarQube Auto-Hosted)
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        # removido o healthcheck que causava "unhealthy"
        options: >-
          --shm-size=2g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for SonarQube to start
        run: |
          echo "Aguardando SonarQube iniciar..."
          for i in {1..60}; do
            STATUS=$(curl -s http://localhost:9000/api/system/health | jq -r '.health' || true)
            if [ "$STATUS" = "GREEN" ]; then
              echo "SonarQube está pronto!"
              break
            fi
            echo "Aguardando... ($i/60)"
            sleep 5
          done
          curl -s http://localhost:9000/api/system/status

      - name: Generate analysis token
        id: token
        run: |
          echo "Gerando token..."
          TOKEN_JSON=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github_token")
          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Falha ao gerar token."
            exit 1
          fi
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: >
            -Dsonar.projectKey=local-analysis
            -Dsonar.projectName=Local SonarQube Demo
            -Dsonar.sources=.
            -Dsonar.exclusions=**/tests/**
            -Dsonar.qualitygate.wait=true

      - name: Fetch analysis metrics
        run: |
          sleep 10
          METRICS="bugs,vulnerabilities,code_smells,coverage"
          RESPONSE=$(curl -s -u admin:${{ env.SONAR_TOKEN }} \
            "http://localhost:9000/api/measures/component?component=local-analysis&metricKeys=$METRICS")
          echo "$RESPONSE" | jq '.' > sonar-results.json
          echo "SONAR_RESPONSE=$(cat sonar-results.json | jq -c .)" >> $GITHUB_ENV

      - name: Summarize analysis
        if: always()
        run: |
          echo "## SonarQube Static Analysis (Local)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.SONAR_RESPONSE }}" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          BUGS=$(jq -r '.component.measures[] | select(.metric=="bugs") | .value' sonar-results.json)
          VULNS=$(jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value' sonar-results.json)
          SMELLS=$(jq -r '.component.measures[] | select(.metric=="code_smells") | .value' sonar-results.json)
          COVERAGE=$(jq -r '.component.measures[] | select(.metric=="coverage") | .value' sonar-results.json)

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bugs | $BUGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilidades | $VULNS |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Smells | $SMELLS |" >> $GITHUB_STEP_SUMMARY
          echo "| Cobertura | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
