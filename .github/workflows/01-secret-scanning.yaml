# ---------------------------------------------------------
# Workflow: 01-secret-scanning.yml
# Objetivo: Detectar segredos expostos no código automaticamente
# Ferramentas: Gitleaks + Trivy
# ---------------------------------------------------------
name: 01-Secret-Scanning

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks + Trivy)
    runs-on: ubuntu-latest

    steps:
      # 1️. Checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para histórico completo em análises de commits

      # 2️. Executa o Gitleaks para encontrar segredos
      # Esta etapa é rápida e cobre padrões conhecidos de API Keys, Tokens, etc.
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        with:
          args: detect --source . --report-format json --report-path gitleaks-report.json

      # 3️. Mostra um resumo legível dos achados do Gitleaks
      - name: Generate Gitleaks Summary
        if: always()
        run: |
          echo "## 🧩 Gitleaks Secret Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s gitleaks-report.json ]; then
            echo "⚠️ Possíveis segredos foram detectados!" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat gitleaks-report.json | jq '. | {findings: length, sample: .findings[0:3]}' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Nenhum segredo encontrado pelo Gitleaks!" >> $GITHUB_STEP_SUMMARY
          fi

      # 4️. Executa o Trivy em modo "secret" para uma segunda camada de análise
      # O Trivy é mais genérico e detecta segredos em diferentes formatos e binários.
      - name: Run Trivy Secret Scanner
        id: trivy
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          scan-type: fs
          scanners: secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json

      # 5️. Gera um resumo visual do Trivy
      - name: Generate Trivy Summary
        if: always()
        run: |
          echo "## 🔐 Trivy Secret Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-report.json ]; then
            COUNT=$(jq '[.Results[]? | select(.Secrets != null) | .Secrets[]] | length' trivy-report.json)
            if [ "$COUNT" -gt 0 ]; then
              echo "⚠️ Trivy encontrou $COUNT possíveis segredos!" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]? | select(.Secrets != null) | .Target as $t | .Secrets[] | "- [\($t)] \(.RuleID): \(.Category) (\(.Severity))"' trivy-report.json | head -10 >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Nenhum segredo encontrado pelo Trivy!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ Falha ao gerar relatório do Trivy." >> $GITHUB_STEP_SUMMARY
          fi

      # 6️. Define o status final do job
      - name: Fail if secrets found
        if: steps.gitleaks.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: |
          echo "❌ Falhas detectadas — existem segredos expostos."
          exit 1