# ---------------------------------------------------------
# Workflow: 03-Dependency-Scan.yml
# Objetivo: Detectar vulnerabilidades em dependências Node.js
# Ferramenta: Trivy (fs scan)
# Falha se houver HIGH/CRITICAL
# Exibe também vulnerabilidades LOW e MEDIUM no resumo
# ---------------------------------------------------------

name: 03-Dependency-Scan

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Node.js Dependency Vulnerability Scan
    runs-on: [arc-runner-set]
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      # 1️. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️. Detect Node.js project
      - name: Detect Node.js project
        run: |
          if [ -f package.json ]; then
            echo "PACKAGE_MANAGER=node" >> $GITHUB_ENV
          else
            echo "PACKAGE_MANAGER=unknown" >> $GITHUB_ENV
          fi
          echo "Detected package manager: $PACKAGE_MANAGER"

      # 3️. Install Node.js + deps
      - name: Install Node.js and tools
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg jq build-essential python3 make gcc g++
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v && npm -v

      # 4️. Install dependencies
      - name: Install dependencies
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          echo "Dependencies installed."

      # 5️. Install Trivy
      - name: Install Trivy
        run: |
          set -e
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy
          trivy --version

      # 6️. Run Trivy Scan (todas as severidades)
      - name: Run Trivy Node Dependency Scan
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -e
          echo "Running Trivy filesystem scan (all severities)..."
          trivy fs . \
            --scanners vuln \
            --vuln-type library \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-deps.json \
            --skip-dirs .git \
            --skip-dirs node_modules/.cache \
            --timeout 10m \
            --no-progress
          echo "Trivy scan completed. Report generated at trivy-deps.json"
          ls -lh trivy-deps.json || true

      # 7️. Parse report and summarize results
      - name: Generate Summary and Evaluate
        run: |
          set -e
          REPORT="trivy-deps.json"
          echo "##  Trivy Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f "$REPORT" ] || [ ! -s "$REPORT" ]; then
            echo " No report generated or empty report!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          TOTAL=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$REPORT")
          HIGH_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$REPORT")
          CRITICAL_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$REPORT")
          MEDIUM_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$REPORT")
          LOW_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="LOW")] | length' "$REPORT")

          echo "**Resumo Geral**" >> $GITHUB_STEP_SUMMARY
          echo "- CRITICAL: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- HIGH: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- MEDIUM: $MEDIUM_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- LOW: $LOW_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- TOTAL: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "###  Vulnerabilidades HIGH/CRITICAL (Top 10)" >> $GITHUB_STEP_SUMMARY
          jq -r '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | 
                  "- \(.PkgName)@\(.InstalledVersion): **\(.Severity)** — \(.Title)"] | .[0:10][]' "$REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "###  Outras Vulnerabilidades (MEDIUM/LOW, Top 10)" >> $GITHUB_STEP_SUMMARY
          jq -r '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM" or .Severity=="LOW") | 
                  "- \(.PkgName)@\(.InstalledVersion): **\(.Severity)** — \(.Title)"] | .[0:10][]' "$REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo " **Falha:** $((HIGH_COUNT + CRITICAL_COUNT)) vulnerabilidades HIGH/CRITICAL detectadas." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo " Nenhuma vulnerabilidade HIGH/CRITICAL encontrada." >> $GITHUB_STEP_SUMMARY
          fi

      # 8️ Upload do relatório JSON completo
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: trivy-deps.json
