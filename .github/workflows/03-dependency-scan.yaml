# ---------------------------------------------------------
# Workflow: 03-Dependency-Scan.yml
# Objetivo: Analisar vulnerabilidades conhecidas em dependências Node
# Ferramenta: Trivy (Node.js)
# ---------------------------------------------------------

name: 03-Dependency-Scan

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Node.js Dependency Vulnerability Scan
    runs-on: [arc-runner-set]
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detecta se é Node.js
      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "PACKAGE_MANAGER=node" >> $GITHUB_ENV
          else
            echo "PACKAGE_MANAGER=unknown" >> $GITHUB_ENV
          fi
          echo "Detected package manager: $PACKAGE_MANAGER"

      # 3. Instala Node.js localmente (autocontido)
      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs build-essential

      # 4. Instala dependências Node
      - name: Install Node.js dependencies
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # 5. Executa Trivy Vulnerability Scan
      - name: Run Trivy Node Dependency Scan
        if: env.PACKAGE_MANAGER == 'node'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln
          vuln-type: library
          format: json
          output: trivy-deps.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
        env:
          TRIVY_CACHE_DIR: /tmp/.trivycache

      # 6. Gera resumo e falha se houver vulnerabilidades HIGH/CRITICAL
      - name: Generate Dependency Scan Summary
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          REPORT="trivy-deps.json"
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY

          if [ -f "$REPORT" ] && [ -s "$REPORT" ]; then
            COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' "$REPORT")
            echo "Encontradas $COUNT vulnerabilidades críticas ou altas." >> $GITHUB_STEP_SUMMARY

            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            jq '[.Results[]? | {target: .Target, type: .Type, vulns: (.Vulnerabilities[]? | {VulnerabilityID, PkgName, InstalledVersion, Severity, Title, PrimaryURL})}] | .[0:20]' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ "$COUNT" -gt 0 ]; then
              echo ""
              echo "Falha: Vulnerabilidades críticas/altas detectadas: $COUNT"
              exit 1
            else
              echo "Nenhuma vulnerabilidade HIGH/CRITICAL encontrada."
            fi
          else
            echo "Nenhum relatório gerado pelo Trivy (relatório ausente ou vazio)."
          fi
