# ---------------------------------------------------------
# Workflow: 03-Dependency-Scan.yml
# Objetivo: Detectar vulnerabilidades em dependências Node.js
# Ferramenta: Trivy (modo SBOM - mais rápido e leve)
# Autocontido, sem dependência de lockfile, falha apenas em HIGH/CRITICAL
# ---------------------------------------------------------

name: 03-Dependency-Scan

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Node.js Dependency Vulnerability Scan
    runs-on: [arc-runner-set]
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      # 1️. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️. Setup Node.js (v22 para compatibilidade com libxmljs2)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️. Instalar Trivy (binário direto)
      - name: Install Trivy
        run: |
          set -e
          echo "Installing Trivy..."
          TRIVY_VERSION="0.57.1"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar zx
          sudo mv trivy /usr/local/bin/
          trivy --version

      # 4️. Executar análise SBOM (sem instalar dependências)
      - name: Run Trivy SBOM scan on Node.js dependencies
        run: |
          set -e
          echo "Running Trivy SBOM vulnerability scan..."
          trivy sbom . \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-deps.json \
            --no-progress \
            --timeout 5m
          echo "Scan completed. JSON report saved."

      # 5️. Gerar resumo e falhar se HIGH/CRITICAL
      - name: Summarize vulnerabilities
        run: |
          set -e
          REPORT="trivy-deps.json"

          if [ ! -s "$REPORT" ]; then
            echo "No report generated!"
            exit 1
          fi

          echo "## Dependency Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$REPORT")
          LOW=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="LOW")] | length' "$REPORT")
          MEDIUM=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$REPORT")
          HIGH=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$REPORT")
          CRITICAL=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$REPORT")

          echo "- CRITICAL: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- HIGH: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- MEDIUM: $MEDIUM" >> $GITHUB_STEP_SUMMARY
          echo "- LOW: $LOW" >> $GITHUB_STEP_SUMMARY
          echo "- TOTAL: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top 10 HIGH/CRITICAL" >> $GITHUB_STEP_SUMMARY
          jq -r '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") |
            "- \(.PkgName)@\(.InstalledVersion): **\(.Severity)** — \(.Title)"] | .[0:10][]' "$REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Top 10 MEDIUM/LOW" >> $GITHUB_STEP_SUMMARY
          jq -r '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM" or .Severity=="LOW") |
            "- \(.PkgName)@\(.InstalledVersion): **\(.Severity)** — \(.Title)"] | .[0:10][]' "$REPORT" >> $GITHUB_STEP_SUMMARY

          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "Detected $((HIGH + CRITICAL)) HIGH/CRITICAL vulnerabilities."
            exit 1
          else
            echo "No HIGH/CRITICAL vulnerabilities detected."
          fi

      # 6️. Upload JSON completo
      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: trivy-deps.json
