# ---------------------------------------------------------
# Workflow: 03-Dependency-Scan.yml
# Objetivo: Analisar vulnerabilidades conhecidas em dependências Node
# Ferramenta: Trivy (Node.js)
# ---------------------------------------------------------

name: 03-Dependency-Scan

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Node.js Dependency Vulnerability Scan
    runs-on: [arc-runner-set]
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detecta se é Node.js (define env)
      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "PACKAGE_MANAGER=node" >> $GITHUB_ENV
          else
            echo "PACKAGE_MANAGER=unknown" >> $GITHUB_ENV
          fi
          echo "Detected package manager: $PACKAGE_MANAGER"

      # 3. Instala Node.js + ferramentas básicas via apt
      - name: Install Node.js and build tools manually
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -eux
          echo "Installing Node.js 20.x and build tools..."
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release jq build-essential python3 make gcc g++
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      # 4. Instala dependências Node.js (completo, incluindo devDependencies)
      - name: Install dependencies
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -e
          if [ -f package-lock.json ]; then
            echo "Using npm ci (lockfile detected)"
            npm ci --prefer-offline --no-audit --no-fund
          else
            echo "No lockfile found, using npm install"
            npm install --no-audit --no-fund
          fi
          echo "Installed dependencies:"
          ls -l node_modules | head -n 20 || true

      # 5. Instala Trivy (binário oficial)
      - name: Install Trivy
        run: |
          set -e
          echo "Installing Trivy..."
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy
          trivy --version

      # 6. Executa o scan das dependências Node.js
      - name: Run Trivy Node Dependency Scan
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -e
          echo "Running Trivy filesystem scan for Node.js dependencies..."
          trivy fs . \
            --scanners vuln \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-deps.json \
            --skip-dirs .git \
            --skip-dirs node_modules/.cache \
            --timeout 10m \
            --no-progress
          echo "Trivy scan completed."

      # 7. Gera summary e falha em caso de HIGH/CRITICAL
      - name: Generate Dependency Scan Summary and fail on HIGH/CRITICAL
        if: env.PACKAGE_MANAGER == 'node'
        run: |
          set -e
          REPORT="trivy-deps.json"
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY

          if [ -f "$REPORT" ] && [ -s "$REPORT" ]; then
            COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' "$REPORT")
            echo "Encontradas $COUNT vulnerabilidades críticas ou altas." >> $GITHUB_STEP_SUMMARY

            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") | {PkgName, InstalledVersion, Severity, Title, PrimaryURL}] | .[0:10]' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ "$COUNT" -gt 0 ]; then
              echo "Falha: vulnerabilidades HIGH/CRITICAL detectadas ($COUNT)"
              exit 1
            else
              echo "Nenhuma vulnerabilidade HIGH/CRITICAL encontrada."
            fi
          else
            echo "Relatório vazio ou não gerado."
            exit 1
          fi
